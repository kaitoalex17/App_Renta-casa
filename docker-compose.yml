version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: renta-casa-app
    restart: unless-stopped
    ports:
      - "3060:3060"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/rentacasa?schema=public
      - NEXTAUTH_SECRET=genera_un_secreto_seguro_aqui_para_produccion
      - NEXTAUTH_URL=http://localhost:3060
      - NEXT_PUBLIC_APP_URL=http://localhost:3060
      - PORT=3060
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: renta-casa-db
    restart: unless-stopped
    ports:
      - "5492:5432" # Puerto PostgreSQL expuesto al host: 5432 + 60 = 5492
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: rentacasa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
